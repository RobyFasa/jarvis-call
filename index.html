<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Parla con Jarvis</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Parla con Jarvis</h1>
    <p id="hint">Quando vuole, inizi la chiamata e consenta l’uso del microfono.</p>
    <div id="orb" aria-hidden="true">Jarvis</div>
    <p id="status" role="status" aria-live="polite">Pronto a collegarsi</p>
    <p id="timer" role="timer" aria-label="Durata della chiamata">00:00</p>
    <button id="start" class="primary" type="button">Inizia</button>
    <button id="enable-audio" type="button" hidden>Attiva l’audio</button>
    <div id="controls" class="controls" hidden>
      <button id="mute" type="button" aria-pressed="false">Disattiva microfono</button>
      <button id="close" class="danger" type="button">Chiudi</button>
    </div>
    <p id="note">Le azioni richieste saranno eseguite in chat dopo la chiamata.</p>
    <section id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">Richieste annotate</h2>
      <p id="result-hint"></p>
      <ul id="requests"></ul>
    </section>
    <audio id="remote-audio" autoplay playsinline></audio>
  </main>
</body>
</html>
